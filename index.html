<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketBaron</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>MarketBaron</h1>
    </div>
    <p class="subtitle">Public portfolio allocation, ticker news, and recent trade posts &mdash; percentages only, never balances or trade size.</p>
    <p class="updated" id="updated"></p>
  </header>

  <main>
    <section class="panel panel-wide" id="allocation-panel">
      <div class="panel-head">
        <h2>Holdings</h2>
        <span class="panel-note" id="holdings-count"></span>
      </div>
      <div class="holdings-list" id="holdings-list"></div>
    </section>

    <div class="panel-grid">
      <section class="panel" id="news-panel">
        <div class="panel-head">
          <h2>News</h2>
        </div>
        <ul class="news-list" id="news-list"></ul>
      </section>

      <section class="panel" id="posts-panel">
        <div class="panel-head">
          <h2>Recent Posts</h2>
        </div>
        <ul class="posts-list" id="posts-list"></ul>
      </section>
    </div>
  </main>

  <footer>
    <p id="empty-state" hidden>No data yet &mdash; check back soon.</p>
    <p class="footnote">Auto-updated on a schedule. Not investment advice.</p>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
